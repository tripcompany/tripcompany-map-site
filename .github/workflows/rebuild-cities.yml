# 도시 페이지 자동 갱신
#
# 하는 일: 구글시트(웹에 게시된 CSV)를 읽어서 도시 페이지(city/<도시>/index.html)를
# 다시 만들고, 바뀐 내용이 있으면 저장소에 커밋합니다.
# 그러면 넷리파이가 그 커밋을 보고 자동으로 사이트를 다시 배포합니다.
#
# 즉, 구글시트만 고치면 몇 시간 안에 사이트에 그대로 반영됩니다 — 사람이 파일을
# 다시 올리거나 뭔가를 누를 필요가 없습니다.
#
# 수동으로 지금 당장 돌리고 싶으면: 깃허브 저장소 → Actions 탭 → 왼쪽에서
# "도시 페이지 자동 갱신" 선택 → 오른쪽의 "Run workflow" 버튼.

name: 도시 페이지 자동 갱신

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (UTC 기준). 더 자주/덜 자주 하고 싶으면 이 줄만 바꾸면 됩니다.
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 도시 페이지 다시 만들기
        run: python3 scripts/generate_cities.py

      - name: 바뀐 내용 있으면 저장하고 올리기
        run: |
          git config user.name "tripcompany-bot"
          git config user.email "actions@users.noreply.github.com"
          git add city/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음 — 그대로 둠"
          else
            git commit -m "도시 페이지 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
