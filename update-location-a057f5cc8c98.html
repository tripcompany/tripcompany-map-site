<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>트콤 위치 업데이트</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #0b0c0b;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .sub { color: #9aa3ab; font-size: 0.85rem; margin: 0 0 20px; }
  #coords {
    font-size: 0.82rem;
    color: #cfd6dc;
    background: #14171a;
    border-radius: 8px;
    padding: 10px 14px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 10px;
  }
  input {
    width: 100%;
    max-width: 320px;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #2a2f33;
    background: #14171a;
    color: #ffffff;
    font-size: 0.95rem;
  }
  input::placeholder { color: #6b7278; }
  button {
    width: 100%;
    max-width: 320px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #3b6fd6;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { background: #3a3d40; color: #8a8f93; }
  .hint {
    margin-top: 14px;
    font-size: 0.78rem;
    color: #6b7278;
    max-width: 320px;
    line-height: 1.5;
  }
  .setup-warning {
    max-width: 340px;
    background: #3a1f1f;
    border: 1px solid #5a2f2f;
    color: #f3c9c9;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.8rem;
    line-height: 1.5;
    margin-bottom: 16px;
    text-align: left;
  }
</style>
</head>
<body>
  <h1>📍 트콤 지금 여기</h1>
  <p class="sub">위치 권한을 허용하면 좌표를 자동으로 가져와요</p>

  <div id="setupWarning" class="setup-warning" hidden>
    아직 아래 FORM_CONFIG 값을 채우지 않았어요. README.md의
    "12. 트콤 실시간 위치 표시하기 — B. 구글 폼 방식"을 참고해서
    이 파일 맨 아래 &lt;script&gt; 안의 FORM_CONFIG 세 값을 본인 구글 폼
    주소로 바꿔주세요.
  </div>

  <div id="coords">위치 확인 중…</div>
  <input id="locationName" type="text" placeholder="지명 (예: 모뉴먼트 밸리, 미국) — 생략 가능">
  <button id="nextBtn" disabled>다음 (구글 폼으로 이동)</button>
  <p class="hint">
    버튼을 누르면 구글 폼 화면으로 이동해요. 좌표는 이미 채워져 있으니,
    그 화면에서 <strong>제출</strong> 버튼까지 한 번 더 눌러야 저장이 끝나요.
  </p>

  <script>
    // ▼▼▼ 여기 세 값을 본인 구글 폼 것으로 바꿔주세요 ▼▼▼
    // 값을 얻는 방법은 README.md "12. 트콤 실시간 위치 표시하기 —
    // B. 구글 폼 방식(Apps Script가 차단될 때)" 항목을 참고하세요.
    const FORM_CONFIG = {
      // 폼 주소에서 "?" 앞부분까지만 (.../viewform 으로 끝나는 형태)
      formActionBase: "https://docs.google.com/forms/d/e/1FAIpQLSf8Xr2Kb4hrpAkrs-LP5NVCc8fobpGJwpATonnSthS8h9mdoA/viewform",
      // "미리 채워진 링크 받기"로 확인한 각 질문의 entry.숫자 값
      latEntry: "entry.467113225",
      lngEntry: "entry.1951983619",
      nameEntry: "entry.1293238229"
    };
    // ▲▲▲ 여기까지 ▲▲▲

    let currentLat = null;
    let currentLng = null;

    const isConfigured = FORM_CONFIG.formActionBase && FORM_CONFIG.latEntry && FORM_CONFIG.lngEntry;
    if (!isConfigured) {
      document.getElementById("setupWarning").hidden = false;
    }

    function onSuccess(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      document.getElementById("coords").textContent =
        currentLat.toFixed(5) + ", " + currentLng.toFixed(5);
      if (isConfigured) {
        document.getElementById("nextBtn").disabled = false;
      }
    }

    function onError(err) {
      document.getElementById("coords").textContent =
        "위치를 가져오지 못했어요 (" + err.message + "). 브라우저의 위치 권한 설정을 확인해주세요.";
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    } else {
      document.getElementById("coords").textContent = "이 브라우저는 위치 확인을 지원하지 않아요.";
    }

    document.getElementById("nextBtn").addEventListener("click", function () {
      if (currentLat === null || currentLng === null || !isConfigured) return;
      const name = document.getElementById("locationName").value;

      const url = new URL(FORM_CONFIG.formActionBase);
      url.searchParams.set("usp", "pp_url");
      url.searchParams.set(FORM_CONFIG.latEntry, currentLat.toFixed(6));
      url.searchParams.set(FORM_CONFIG.lngEntry, currentLng.toFixed(6));
      if (FORM_CONFIG.nameEntry && name) {
        url.searchParams.set(FORM_CONFIG.nameEntry, name);
      }
      window.location.href = url.toString();
    });
  </script>
</body>
</html>
